extensions:
  file_storage/journald:
    directory: /var/lib/otelcol/journald
    create_directory: true

receivers:
  journald:
    directory: /var/log/journal
    start_at: end
    storage: file_storage/journald

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]
  resource:
    attributes:
      - key: service.name
        value: systemd-journal
        action: insert
  batch:

exporters:
  otlphttp:
    # Pinned ClusterIP of the in-cluster otel-collector Service (reached via
    # kube-proxy DNAT); must match service.clusterIP in
    # k8s/argocd/observability/otel-collector.yaml.
    endpoint: http://10.43.0.100:4318

service:
  extensions: [file_storage/journald]
  pipelines:
    logs:
      receivers: [journald]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlphttp]
