apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-usage-receiver
  namespace: default
  labels:
    app: android-usage-receiver
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: android-usage-receiver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: android-usage-receiver
    spec:
      containers:
        - name: android-usage-receiver
          image: ghcr.io/kazu728/android-usage-receiver:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nats-client-auth
                  key: token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: android-usage-receiver
  namespace: default
  labels:
    app: android-usage-receiver
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31080
      protocol: TCP
  selector:
    app: android-usage-receiver
