apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd-apps
  namespace: kube-system
spec:
  chart: argocd-apps
  repo: https://argoproj.github.io/argo-helm
  targetNamespace: argo-cd
  valuesContent: |-
    projects:
      platform:
        namespace: argo-cd
        description: Platform components (ArgoCD addons, NATS)
        sourceRepos:
          - "*"
        destinations:
          - namespace: "*"
            server: "*"
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
      observability:
        namespace: argo-cd
        description: Metrics / logs / dashboards
        sourceRepos:
          - "*"
        destinations:
          - namespace: "*"
            server: "*"
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
      apps:
        namespace: argo-cd
        description: Application workloads
        sourceRepos:
          - "*"
        destinations:
          - namespace: "*"
            server: "*"
        clusterResourceWhitelist:
          - group: "*"
            kind: "*"
    applications:
      apps:
        namespace: argo-cd
        project: default
        source:
          repoURL: https://github.com/kazu728/homelab.git
          targetRevision: HEAD
          path: k8s/argocd
        destination:
          server: https://kubernetes.default.svc
          namespace: argo-cd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - RespectIgnoreDifferences=true
        ignoreDifferences:
          - group: argoproj.io
            kind: Application
            name: manifest
            namespace: argo-cd
            jsonPointers:
              - /spec/source/kustomize
