apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argo-cd
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 80.8.2
    helm:
      skipCrds: true
      valuesObject:
        defaultRules:
          create: true
          rules:
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false

        additionalPrometheusRulesMap:
          homelab-observability:
            groups:
              - name: homelab-observability
                rules:
                  - alert: LokiContainerNotReady
                    expr: kube_pod_container_status_ready{namespace="observability", container="loki"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      component: loki
                    annotations:
                      summary: Loki container is not ready
                      description: The loki container in observability/{{ $labels.pod }} has been unready for at least 5 minutes.
                  - alert: LokiContainerRestarting
                    expr: increase(kube_pod_container_status_restarts_total{namespace="observability", container="loki"}[15m]) > 0
                    for: 5m
                    labels:
                      severity: warning
                      component: loki
                    annotations:
                      summary: Loki container is restarting
                      description: The loki container in observability/{{ $labels.pod }} restarted during the last 15 minutes.

          homelab-backup:
            groups:
              - name: homelab-backup
                rules:
                  - alert: ResticBackupStale
                    expr: time() - node_textfile_mtime_seconds{file="/host/textfile/restic-piano-capture.prom"} > 36 * 3600
                    for: 10m
                    labels:
                      severity: critical
                      component: backup
                    annotations:
                      summary: restic backup has not succeeded recently
                      description: The piano capture backup last succeeded {{ $value | humanizeDuration }} ago.
                  - alert: ResticBackupMetricsMissing
                    expr: absent(node_textfile_mtime_seconds{file="/host/textfile/restic-piano-capture.prom"})
                    for: 1h
                    labels:
                      severity: critical
                      component: backup
                    annotations:
                      summary: restic backup metrics are missing
                      description: No restic-piano-capture.prom is exposed by node-exporter, so backup health is unknown.
                  - alert: ResticRepositoryLarge
                    expr: restic_repository_size_bytes > 1e9
                    for: 1h
                    labels:
                      severity: warning
                      component: backup
                    annotations:
                      summary: restic repository is larger than expected
                      description: The {{ $labels.backup }} repository holds {{ $value | humanize }}B.
                  - alert: ResticRepositoryTooLarge
                    expr: restic_repository_size_bytes > 5e9
                    for: 1h
                    labels:
                      severity: critical
                      component: backup
                    annotations:
                      summary: restic repository is approaching the R2 free tier
                      description: The {{ $labels.backup }} repository holds {{ $value | humanize }}B against a 10GB free tier.

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              - source_matchers:
                  - 'severity = critical'
                target_matchers:
                  - 'severity =~ warning|info'
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - 'severity = warning'
                target_matchers:
                  - 'severity = info'
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - 'alertname = InfoInhibitor'
                target_matchers:
                  - 'severity = info'
                equal:
                  - namespace
              - target_matchers:
                  - 'alertname = InfoInhibitor'
            route:
              group_by: [ namespace, alertname ]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: homelab-slack
              routes:
                - receiver: 'null'
                  matchers:
                    - 'alertname = Watchdog'
                # Operator list/watch failures are transient blips from Wi-Fi
                # uplink flaps; the operator self-recovers, so there is nothing
                # to act on. Keep the metrics, drop the page.
                - receiver: 'null'
                  matchers:
                    - 'alertname =~ PrometheusOperatorListErrors|PrometheusOperatorWatchErrors'
            receivers:
              - name: 'null'
              - name: homelab-slack
                slack_configs:
                  - send_resolved: true
                    api_url_file: /etc/alertmanager/secrets/homelab-alertmanager-webhook/url
            templates:
              - /etc/alertmanager/config/*.tmpl
          alertmanagerSpec:
            secrets:
              - homelab-alertmanager-webhook
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi

        grafana:
          enabled: false

        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus-node-exporter:
          hostNetwork: false
          extraArgs:
            - --collector.textfile.directory=/host/textfile
          extraHostVolumeMounts:
            - name: textfile
              hostPath: /var/lib/node-exporter/textfile
              type: DirectoryOrCreate
              mountPath: /host/textfile
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi

        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              memory: 300Mi

        prometheus:
          prometheusSpec:
            retention: 30d
            retentionSize: 8GiB
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelector:
              matchLabels:
                release: kube-prometheus-stack
            externalLabels:
              cluster: n150
            resources:
              requests:
                cpu: 200m
                memory: 200Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ "ReadWriteOnce" ]
                  resources:
                    requests:
                      storage: 10Gi
        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 200Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
