apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argo-cd
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.4.1
    helm:
      valuesObject:
        service:
          type: NodePort
          # Loopback-bound NodePort fronted by tailscale serve;
          # must match hosts/n150/modules/tailscale.nix.
          nodePort: 30300

        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password

        datasources:
          "datasources.yaml":
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
                isDefault: true
              - name: Loki
                type: loki
                access: proxy
                url: http://loki-gateway.observability.svc.cluster.local

        initChownData:
          enabled: false

        sidecar:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          dashboards:
            enabled: true
            resource: configmap
            labelValue: "1"
            provider:
              folder: Kubernetes
              folderUid: kubernetes

        resources:
          requests:
            cpu: 50m
            memory: 150Mi
          limits:
            memory: 300Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
