apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argo-cd
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.49.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
            filesystem:
              chunks_directory: /var/loki/chunks
              rules_directory: /var/loki/rules
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 168h  # 7d
            allow_structured_metadata: true
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
            working_directory: /var/loki/compactor
          rulerConfig:
            storage:
              type: local
              local:
                directory: /rules
            # Scratch dir must differ from the read path (/rules); the ruler
            # cleans rule_path on sync.
            rule_path: /tmp/loki-rules-scratch
            alertmanager_url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
            # Alertmanager 0.27+ dropped the v1 API
            enable_alertmanager_v2: true

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClassName: local-path
            size: 10Gi
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        gateway:
          enabled: true
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution: []
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi

        sidecar:
          rules:
            # Tenant dir: auth_enabled=false means the single tenant "fake"
            folder: /rules/fake

        monitoring:
          serviceMonitor:
            enabled: true
          rules:
            enabled: true
            labels:
              release: kube-prometheus-stack

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
