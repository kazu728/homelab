apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: argo-cd
spec:
  project: platform
  source:
    repoURL: https://github.com/kazu728/homelab.git
    targetRevision: HEAD
    path: k8s/argocd/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
