apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argo-cd
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.1.5
    helm:
      valuesObject:
        config:
          "argocd.namespace": argo-cd
          "log.level": info

        extraObjects:
          - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
            kind: ImageUpdater
            metadata:
              name: android-usage-receiver
              namespace: argo-cd
            spec:
              writeBackConfig:
                method: argocd
              applicationRefs:
                - namePattern: manifest
                  images:
                    - alias: androidusagereceiver
                      imageName: ghcr.io/kazu728/android-usage-receiver:latest
                      commonUpdateSettings:
                        updateStrategy: newest-build
                        allowTags: "regexp:^[0-9a-f]{40}$"
                      manifestTargets:
                        kustomize:
                          name: ghcr.io/kazu728/android-usage-receiver
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
